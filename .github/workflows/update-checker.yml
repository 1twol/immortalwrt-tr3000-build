name: Update Checker

env:
  # 可在仓库 Settings → Variables 覆盖，未设置时使用下面的默认值
  REPO_URL: ${{ vars.SOURCE_REPO || 'https://github.com/chasey-dev/immortalwrt-mt798x-rebase' }}
  REPO_BRANCH: ${{ vars.SOURCE_BRANCH || '25.12' }}
  BUILD_CONFIG: ${{ vars.BUILD_CONFIG || 'config/25.12-256m.config' }}
  BUILD_DEVICE: ${{ vars.BUILD_DEVICE || 'TR3000-256M' }}
  BUILD_EXTRAS: ${{ vars.BUILD_EXTRAS || 'true' }}

on:
  workflow_dispatch:
  schedule:
    - cron: 0 0 1 * *

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Get Commit Hash
        id: getHash
        run: |
          git clone --depth 1 $REPO_URL -b $REPO_BRANCH .
          echo "commitHash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Compare Commit Hash
        id: cacheHash
        uses: actions/cache@v4
        with:
          path: .commitHash
          key: commitHash_${{ steps.getHash.outputs.commitHash }}

      - name: Save New Commit Hash
        if: steps.cacheHash.outputs.cache-hit != 'true'
        run: |
          echo ${{ steps.getHash.outputs.commitHash }} | tee .commitHash

      - name: Trigger build
        if: steps.cacheHash.outputs.cache-hit != 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ github.token }}
          event-type: Source Code Update
          client-payload: '{"repo": "${{ env.REPO_URL }}", "branch": "${{ env.REPO_BRANCH }}", "config": "${{ env.BUILD_CONFIG }}", "device": "${{ env.BUILD_DEVICE }}", "extras": "${{ env.BUILD_EXTRAS }}", "release": "true"}'
          
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 2
