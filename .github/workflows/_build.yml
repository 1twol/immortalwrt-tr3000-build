name: Build (internal)

permissions:
  contents: write

on:
  workflow_call:
    inputs:
      repo:
        required: true
        type: string
      branch:
        required: true
        type: string
      config:
        required: true
        type: string
      device:
        required: true
        type: string
      commit:
        required: false
        type: string
        default: ''
      extras:
        required: false
        type: boolean
        default: true
      ssh:
        required: false
        type: boolean
        default: false
      release:
        required: false
        type: boolean
        default: true
      prerelease:
        required: false
        type: boolean
        default: false

env:
  DEVICE_INPUT: ${{ inputs.device }}
  CONFIG_FILE: ${{ inputs.config }}
  REPO_URL: ${{ inputs.repo }}
  REPO_BRANCH: ${{ inputs.branch }}
  REPO_COMMIT: ${{ inputs.commit }}
  ENABLE_EXTRAS: ${{ inputs.extras }}
  CCACHE_DIR: /workdir/.ccache
  CCACHE_MAXSIZE: 2G
  FEEDS_CONF: feeds.conf.default
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_RELEASE: ${{ inputs.release }}
  PRERELEASE: ${{ inputs.prerelease }}
  TZ: Asia/Shanghai

jobs:
  menuconfig:
    name: ⚙️ Menuconfig & Push
    if: inputs.ssh
    runs-on: ubuntu-22.04
    steps:
      - name: 🙌 Checkout
        uses: actions/checkout@v5

      - name: 🧭 Validate inputs
        run: |
          [ -n "$REPO_URL" ] || { echo "::error::repo 不能为空"; exit 1; }
          [ -n "$REPO_BRANCH" ] || { echo "::error::branch 不能为空"; exit 1; }
          [ -n "$CONFIG_FILE" ] || { echo "::error::config 不能为空"; exit 1; }

      - name: 🛠️ Init Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libncurses-dev build-essential git wget python3 bzip2
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 🪜 Clone source code
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none openwrt
          if [ -n "${REPO_COMMIT}" ]; then
            cd openwrt && git checkout ${REPO_COMMIT}
          fi
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 👩‍💻 Copy previous config if exists
        run: |
          if [ -f "$GITHUB_WORKSPACE/${CONFIG_FILE}" ]; then
            cp -f "$GITHUB_WORKSPACE/${CONFIG_FILE}" /workdir/openwrt/.config
          fi

      - name: 🧬 Update & Install feeds
        run: |
          cd openwrt
          [ -e "$GITHUB_WORKSPACE/$FEEDS_CONF" ] && mv "$GITHUB_WORKSPACE/$FEEDS_CONF" feeds.conf.default
          if [ "${ENABLE_EXTRAS}" = "true" ]; then
            chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
            "$GITHUB_WORKSPACE/$DIY_P1_SH"
          fi
          ./scripts/feeds update -a
          [ -f feeds/packages/lang/rust/Makefile ] && sed -i 's/download-ci-llvm=true/download-ci-llvm=false/g' feeds/packages/lang/rust/Makefile || true
          ./scripts/feeds install -a
          if [ "${ENABLE_EXTRAS}" = "true" ]; then
            chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"
            "$GITHUB_WORKSPACE/$DIY_P2_SH"
          fi

      - name: ⌨️ SSH connection to Menuconfig
        uses: owenthereal/action-upterm@v1.15.0
        timeout-minutes: 15
        with:
          limit-access-to-actor: true
          upterm-version: v0.29.0

      - name: 📤 Push config to main branch
        run: |
          SRC="/workdir/openwrt/.config"
          DST="$GITHUB_WORKSPACE/${CONFIG_FILE}"
          mkdir -p "$(dirname "$DST")"
          cp -f "$SRC" "$DST"
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$CONFIG_FILE"

          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)

          git diff --cached --quiet || (
            git commit -m "Update config: ${CONFIG_FILE}" || true
            git pull --rebase origin $CURRENT_BRANCH
            git push -f origin HEAD:$CURRENT_BRANCH
          )

  build:
    name: 🔨 Build Firmware
    needs: menuconfig
    if: always() && (needs.menuconfig.result == 'success' || needs.menuconfig.result == 'skipped')
    runs-on: ubuntu-22.04

    steps:
      - name: 🙌 Checkout
        uses: actions/checkout@v5

      - name: 🧭 Validate inputs
        run: |
          [ -n "$REPO_URL" ] || { echo "::error::repo 不能为空"; exit 1; }
          [ -n "$REPO_BRANCH" ] || { echo "::error::branch 不能为空"; exit 1; }
          [ -n "$CONFIG_FILE" ] || { echo "::error::config 不能为空"; exit 1; }

      - name: 🪠 Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 🛠️ Init Environment
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: 🪜 Clone source code
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --filter=blob:none openwrt
          if [ -n "${REPO_COMMIT}" ]; then
            cd openwrt && git checkout ${REPO_COMMIT}
          fi
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: ⚙️ Setup ccache & DL cache
        uses: actions/cache@v4
        with:
          path: |
            /workdir/.ccache
            /workdir/openwrt/dl
          key: ${{ runner.os }}-openwrt-combined-${{ env.REPO_BRANCH }}-${{ hashFiles('config/*.config') }}
          restore-keys: |
            ${{ runner.os }}-openwrt-combined-${{ env.REPO_BRANCH }}-

      - name: 🔧 Configure ccache
        run: |
          ccache --set-config=max_size=$CCACHE_MAXSIZE
          ccache --set-config=cache_dir=$CCACHE_DIR
          ccache --set-config=compression=true
          ccache -z

      - name: 🧬 Update & Install feeds
        run: |
          cd openwrt
          [ -e "$GITHUB_WORKSPACE/$FEEDS_CONF" ] && mv "$GITHUB_WORKSPACE/$FEEDS_CONF" feeds.conf.default
          if [ "${ENABLE_EXTRAS}" = "true" ]; then
            chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
            "$GITHUB_WORKSPACE/$DIY_P1_SH"
          fi
          ./scripts/feeds update -a
          [ -f feeds/packages/lang/rust/Makefile ] && sed -i 's/download-ci-llvm=true/download-ci-llvm=false/g' feeds/packages/lang/rust/Makefile || true
          ./scripts/feeds install -a
          if [ "${ENABLE_EXTRAS}" = "true" ]; then
            chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"
            "$GITHUB_WORKSPACE/$DIY_P2_SH"
          fi

      - name: 🔨 Compile Firmware
        id: compile
        run: |
          set -e
          CONFIG="$GITHUB_WORKSPACE/${CONFIG_FILE}"
          if [ ! -f "$CONFIG" ]; then
            echo "::error::配置文件不存在: ${CONFIG_FILE}"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/firmware_collection"
          cd /workdir/openwrt

          echo "Using repo:   $REPO_URL ($REPO_BRANCH)"
          echo "Using config: $CONFIG_FILE"
          echo "Device label: $DEVICE_INPUT"

          cp -f "$CONFIG" .config
          make defconfig
          make download -j$(nproc)

          if ! make -j$(nproc); then
            echo "⚠️ Multi-threaded failed, retrying single-threaded..."
            make -j1 V=s
          fi

          echo "📥 Collecting artifacts"
          find bin/targets/ -name "*sysupgrade.bin" -exec cp {} "$GITHUB_WORKSPACE/firmware_collection/" \;
          ls -lh "$GITHUB_WORKSPACE/firmware_collection/"
          (cd "$GITHUB_WORKSPACE/firmware_collection" && sha256sum * > sha256sums.txt)
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 🪄 Upload Binaries (Artifacts)
        uses: actions/upload-artifact@v5
        if: steps.compile.outputs.status == 'success'
        with:
          name: ImmortalWrt_${{ env.DEVICE_INPUT }}_${{ env.REPO_BRANCH }}
          path: ${{ github.workspace }}/firmware_collection/*

      - name: 📌 Generate Release Tag
        id: tag
        if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
        run: |
          BUILD_TIME=$(date +"%Y%m%d-%H%M")
          RELEASE_TAG="ImmortalWrt-${BUILD_TIME}-${DEVICE_INPUT}"
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

          cat > release.txt << EOF
          ## 📦 ImmortalWrt Firmware Release

          **🏷️ Release:** $RELEASE_TAG
          **🌿 Source:** $REPO_URL
          **🌿 Branch:** $REPO_BRANCH
          **📱 Device:** ${DEVICE_INPUT}
          **⚙️ Config:** ${CONFIG_FILE}
          **📅 Build Date:** $(date +"%Y-%m-%d %H:%M:%S")
          **🔨 Compiler:** GCC with ccache

          ## 📥 Download

          Download the firmware files from the assets below.

          ---

          Built with ❤️ using [GitHub Actions](https://github.com/features/actions)
          EOF

          echo "status=success" >> $GITHUB_OUTPUT

      - name: 📤 Upload to Release
        uses: softprops/action-gh-release@v2
        if: steps.tag.outputs.status == 'success'
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          body_path: release.txt
          prerelease: ${{ env.PRERELEASE == 'true' }}
          files: ${{ github.workspace }}/firmware_collection/*

      - name: 🚧 Delete old workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 0
          keep_minimum_runs: 9
